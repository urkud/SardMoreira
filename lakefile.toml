name = "SardMoreira"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["SardMoreira"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/urkud/mathlib4"
rev = "implicit-param"

[[require]]
name = "checkdecls"
scope = "PatrickMassot"
rev = "master"

[[lean_lib]]
name = "SardMoreira"
